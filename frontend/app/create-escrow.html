<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Job — Tetscrow</title>
<link rel="stylesheet" href="../css/landing.css" />
<link rel="stylesheet" href="../css/app-home.css" />
<link rel="stylesheet" href="../css/app-pages.css" />
</head>
<body>
<div class="wrap page">
  <header id="app-header"></header>
  <main id="gate"></main>

  <main class="wiz hidden" id="wizard">
    <section class="steps-card" style="width:auto;align-self:start">
      <h4>Steps<span class="bars"><i class="on" id="bar1"></i><i id="bar2"></i></span></h4>
      <div class="st on" id="s1"><span>&rarr;</span><span>Enter Basic info about the Job</span></div>
      <div class="st" id="s2"><span>&rarr;</span><span>Select Asset and enter Wallets.</span></div>
    </section>

    <div class="modal" style="width:100%;max-width:none" id="card">
      <form id="step1" class="stack" onsubmit="return false" style="display:flex;flex-direction:column;gap:14px">
        <input class="field" id="f-title" maxlength="140" placeholder="Enter Job Title" aria-label="Job title" />
        <textarea class="field" id="f-desc" maxlength="5000" placeholder="Enter Detailed Job Description" aria-label="Job description" style="min-height:170px"></textarea>
        <div class="modal-actions" style="justify-content:center"><button class="btn-pill" id="go2" type="button" style="max-width:260px">Save and Go Forward</button></div>
      </form>

      <form id="step2" class="hidden" onsubmit="return false" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;gap:10px;align-items:center"><span class="btn-pill" style="padding:.7em 1.2em">USDC</span><span class="muted" style="font-size:.85rem">Stablecoin on Arc &middot; fees are paid in USDC</span></div>
        <input class="field" id="f-amount" type="number" min="0" step="0.000001" inputmode="decimal" placeholder="Enter Amount" aria-label="Amount in USDC" />
        <input class="field" id="f-deadline" type="date" aria-label="Deadline" />
        <input class="field" id="f-worker" placeholder="Enter Worker's Wallet Address" autocomplete="off" spellcheck="false" aria-label="Worker wallet address" />
        <input class="field" id="f-secondary" placeholder="Enter Your Secondary Wallet Address (optional)" autocomplete="off" spellcheck="false" aria-label="Secondary wallet address" />
        <p class="modal-note" id="status" role="status"></p>
        <div class="modal-actions"><button class="btn-pill light" id="back1" type="button">Go Back</button><button class="btn-pill" id="create" type="button">Create</button></div>
      </form>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/hawk3d.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/site-config.js"></script>
<script src="../js/site.js"></script>
<script src="../js/wallet.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app-shell.js"></script>
<script>
  const gate = document.getElementById("gate"), wizard = document.getElementById("wizard");
  const $ = (id) => document.getElementById(id);
  const ADDR = /^0x[0-9a-fA-F]{40}$/;
  const GRACE_DAYS = 30; // the on-chain refund date sits this long after the job deadline, so approved extensions fit
  let pending = null;   // funded on-chain but not saved yet (retry target)

  function setStatus(t, kind) { const n = $("status"); n.textContent = t; n.className = "modal-note " + (kind || ""); }
  function goStep(n) {
    $("step1").classList.toggle("hidden", n !== 1); $("step2").classList.toggle("hidden", n !== 2);
    $("bar2").classList.toggle("on", n === 2); $("s2").classList.toggle("on", n === 2);
  }
  $("f-deadline").min = App.todayPlus(1);

  $("go2").onclick = () => {
    if (!$("f-title").value.trim()) { $("f-title").focus(); return App.toast("Enter a job title first", "err"); }
    goStep(2);
  };
  $("back1").onclick = () => goStep(1);

  async function save() {
    const job = await TetscrowApi.createJob(pending);
    setStatus("Escrow funded and saved. Opening your job...", "ok");
    pending = null;
    setTimeout(() => (location.href = "escrow-detail.html?id=" + job.id), 900);
  }

  $("create").onclick = async () => {
    const btn = $("create");
    if (pending) { btn.disabled = true; try { await save(); } catch (e) { setStatus("Still could not save: " + e.message, "err"); btn.disabled = false; } return; }
    const title = $("f-title").value.trim(), description = $("f-desc").value.trim();
    const amount = $("f-amount").value.trim(), deadline = $("f-deadline").value;
    const worker = $("f-worker").value.trim(), secondary = $("f-secondary").value.trim();
    if (!(Number(amount) > 0)) return setStatus("Enter an amount greater than 0.", "err");
    if (!deadline || deadline < App.todayPlus(1)) return setStatus("Pick a deadline in the future.", "err");
    if (!ADDR.test(worker)) return setStatus("The worker's wallet must be a valid address (0x...).", "err");
    if (secondary && !ADDR.test(secondary)) return setStatus("The secondary wallet must be a valid address (0x...).", "err");
    let raw; try { raw = Tetscrow.parseUsdc(amount); } catch { return setStatus("USDC amounts can have at most 6 decimals.", "err"); }
    btn.disabled = true;
    try {
      setStatus("Connecting wallet...");
      const me = await Tetscrow.connectWallet();
      if (me.toLowerCase() === worker.toLowerCase()) throw new Error("The worker's wallet must be different from yours.");
      if (!Tetscrow.hasValidSession()) await Tetscrow.signInWithModal();
      setStatus("Approve the USDC spending cap, then confirm the deposit in your wallet...");
      const deadlineTs = Math.floor(new Date(deadline + "T23:59:59").getTime() / 1000) + GRACE_DAYS * 86400;
      const { escrowId, txHash } = await Tetscrow.createEscrow({ payee: worker, milestones: [{ description: description || title, amount }], deadlineTs });
      pending = {
        title, description: description || null, receiver_address: worker, secondary_address: secondary || null,
        milestone: { description: description || title, amount: Tetscrow.formatUsdcExact(raw), deadline, onchain_id: escrowId, tx_hash: txHash, token_address: window.TETSCROW_CONFIG.USDC_ADDRESS },
      };
      setStatus("Funds locked on-chain. Saving your job...");
      try { await save(); }
      catch (e) { setStatus("Your USDC IS locked on-chain (tx " + txHash + "), but saving failed: " + e.message + ". Press Create to retry saving.", "err"); btn.disabled = false; }
    } catch (err) { setStatus(Tetscrow.explainError(err), "err"); btn.disabled = false; }
  };

  function refresh() { if (App.signedIn()) { gate.classList.add("hidden"); gate.innerHTML = ""; wizard.classList.remove("hidden"); } else { wizard.classList.add("hidden"); gate.classList.remove("hidden"); App.gate(gate); } }
  window.addEventListener("tetscrow:wallet", refresh);
  App.header("create");
  (async () => { await Tetscrow.restoreSession(); refresh(); })();
</script>
</body>
</html>
